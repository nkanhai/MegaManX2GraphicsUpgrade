name: HD-2D Unity managed reconstruction

on: [push, pull_request]

permissions:
  contents: read

jobs:
  managed-native-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Install native harness dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ninja-build
      - name: Build original synthetic capture and pinned PPU oracle
        run: |
          cmake -S hd2d/tests/native -B hd2d/local/unity-native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build hd2d/local/unity-native --target scanout_on scanout_replay --parallel 2
          hd2d/local/unity-native/scanout_on hd2d/local/unity-source
          python hd2d/tools/make_unity_fixtures.py --synthetic hd2d/local/unity-source/capture.x2scan --replay hd2d/local/unity-native/scanout_replay --output hd2d/local/unity-fixtures
      - name: Validate C# reader, component metadata and native pixel parity
        run: dotnet run --project hd2d/tests/unity/CoreTests.csproj --configuration Release -- hd2d/local/unity-fixtures
      - name: Validate wire contract and repository asset hygiene
        run: python -m unittest discover -s hd2d/tests -v
      # Unity Editor/GPU tests are a separate owner-run qualification, documented
      # in hd2d/unity/README.md. No license, ROM, private capture or game asset here.
